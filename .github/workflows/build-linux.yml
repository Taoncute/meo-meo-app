name: Build Linux AppImage

on:
  push:
    branches: [main, master]
    paths:
      - 'meo-meo-app/**'
      - '.github/workflows/build-linux.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'meo-meo-app/**'
      - '.github/workflows/build-linux.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd meo-meo-app
          npm install

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools libfuse2

      - name: Build Linux AppImage
        run: |
          cd meo-meo-app
          npx electron-builder --linux AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meo-meo-app-linux
          path: |
            meo-meo-app/dist/*.AppImage
            meo-meo-app/dist/*.deb
            meo-meo-app/dist/*.rpm
            meo-meo-app/dist/*.tar.gz
          retention-days: 30
          if-no-files-found: error