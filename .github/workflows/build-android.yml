name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: 33.0.0
          ndk: 25.2.9519653
          cmake: 3.22.1

      - name: Build Android APK
        run: |
          npx cap init meo-meo-app com.meomeo.app
          npx cap add android
          npx cap sync android
          cd android
          ./gradlew assembleDebug -PcdvSkipDriveBuild=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meo-meo-app-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error