name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Install SDK components
        run: |
          SDKMANAGER=$(find $ANDROID_HOME -name "sdkmanager" -type f | head -1)
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-33" "build-tools;33.0.0"

      - name: Build Android APK
        run: |
          mkdir -p www
          cp index.html style.css app.js www/
          npx cap init meo-meo-app com.meomeo.app --web-dir www
          npx cap add android
          npx cap sync android
          echo "" >> android/app/build.gradle
          echo "configurations.all {" >> android/app/build.gradle
          echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" >> android/app/build.gradle
          echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle
          cd android
          ./gradlew assembleDebug -PcdvSkipDriveBuild=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meo-meo-app-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
